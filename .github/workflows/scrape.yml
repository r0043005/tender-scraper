name: Daily Tender Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 確保獲取完整歷史以利 commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python tender_scraper.py
        continue-on-error: true # 即使爬蟲報錯也繼續，由後續 Git 步驟處理檔案

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 建立檔案（如果不存在），確保 git add 不會崩潰
          if [ ! -f tenders.json ]; then
            echo "[]" > tenders.json
          fi
          
          git add tenders.json
          
          # 檢查是否有異動，有才 commit
          if ! git diff --cached --quiet; then
            git commit -m "Auto update: tenders.json $(date)"
            git push
          else
            echo "No changes to commit"
          fi
