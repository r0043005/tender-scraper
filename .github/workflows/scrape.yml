name: Daily Tender Scrape

on:
  schedule:
    # 每天凌晨 00:00 (UTC) 執行，台灣時間為 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許手動從 GitHub 介面點擊執行

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Action 將檔案 commit 回來

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python tender_scraper.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tenders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: tenders.json $(date)" && git push)
